# Идентификаторы из SonarQube Cloud → Project onboarding → Rust/Cargo.
sonar.projectKey=Flandre-Scarlet-the-best_anki-deck-toolkit
sonar.organization=flandre-scarlet-the-best
sonar.projectName=Anki Deck Toolkit
sonar.sourceEncoding=UTF-8

# Рабочая область Cargo, скрипты, процессы GitHub Actions и корневые конфигурации.
sonar.sources=tools,.github,Cargo.toml,rust-toolchain.toml,renovate.json,deny.toml
sonar.rust.cargo.manifestPaths=Cargo.toml
# LCOV создан тестами Rust в той же рабочей копии до запуска SonarScanner.
# Импортёр принимает DA только в диапазоне int32; исходный LCOV для Codecov не меняется.
sonar.rust.lcov.reportPaths=lcov-sonar.info
# Скрипты CI в Sonar классифицированы как Python-код и измеряются отдельно.
sonar.python.coverage.reportPaths=python-coverage.xml

# Отделяем файлы тестов от производственного кода, не исключая их из анализа.
sonar.tests=tools,.github
sonar.test.inclusions=**/tests/**,**/src/**/tests.rs,**/src/**/*_tests.rs,**/src/**/test_support.rs,**/src/**/*_test_support.rs,**/src/**/test_ports.rs,**/test_*.py,**/*_test.cjs
sonar.exclusions=**/tests/**,**/src/**/tests.rs,**/src/**/*_tests.rs,**/src/**/test_support.rs,**/src/**/*_test_support.rs,**/src/**/test_ports.rs,**/test_*.py,**/*_test.cjs,**/target/**,**/node_modules/**,**/fixtures/**,**/*.otf,**/*.zlib,**/*.profraw
sonar.test.exclusions=**/fixtures/**,**/*.otf,**/*.zlib

# Сценарии E2E исполняются только в opt-in Docker-стенде anki-e2e, не в cargo test.
# Исключается лишь их покрытие: замечания по ним анализируются. Тот же список — в codecov.yml.
sonar.coverage.exclusions=tools/anki-e2e/src/**/*scenarios.rs,tools/anki-e2e/src/agent/scenarios/**
