# Идентификаторы из SonarQube Cloud → Project onboarding → Rust/Cargo.
sonar.projectKey=Flandre-Scarlet-the-best_anki-deck-toolkit
sonar.organization=flandre-scarlet-the-best
sonar.projectName=Anki Deck Toolkit
sonar.sourceEncoding=UTF-8

# Рабочая область Cargo, скрипты, процессы GitHub Actions и корневые конфигурации.
sonar.sources=tools,.github,Cargo.toml,rust-toolchain.toml,renovate.json,deny.toml
sonar.rust.cargo.manifestPaths=Cargo.toml

# Отделяем файлы тестов от производственного кода, не исключая их из анализа.
sonar.tests=tools,.github
sonar.test.inclusions=**/tests/**,**/src/**/tests.rs,**/src/**/*_tests.rs,**/src/**/test_support.rs,**/src/**/*_test_support.rs,**/src/**/test_ports.rs,**/test_*.py,**/*_test.cjs
sonar.exclusions=**/tests/**,**/src/**/tests.rs,**/src/**/*_tests.rs,**/src/**/test_support.rs,**/src/**/*_test_support.rs,**/src/**/test_ports.rs,**/test_*.py,**/*_test.cjs,**/target/**,**/node_modules/**,**/fixtures/**,**/*.otf,**/*.zlib
sonar.test.exclusions=**/fixtures/**,**/*.otf,**/*.zlib
