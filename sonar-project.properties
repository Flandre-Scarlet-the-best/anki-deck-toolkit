# Идентификаторы проекта берутся из GitHub Actions variables, а не хранятся в Git.
# SONAR_ORGANIZATION и SONAR_PROJECT_KEY передаются официальному action через args.
sonar.projectName=Anki Deck Toolkit
sonar.sourceEncoding=UTF-8

# Rust Cargo Workspace из tools/, скрипты и GitHub Actions.
sonar.sources=tools,.github
sonar.rust.cargo.manifestPaths=Cargo.toml

# Тесты не должны учитываться как производственный код.
sonar.test.inclusions=**/tests/**,**/test_*.py

# Генерируемые сборкой файлы и тестовые ресурсы не анализируются.
sonar.exclusions=**/target/**,**/node_modules/**,**/fixtures/**
