# Корневая рабочая область Cargo — каноническая точка запуска проверок Rust
# в репозитории. Из неё `cargo` видит набор инструментов `tools/anki-repo`, поэтому CI и
# локальные проверки не зависят от фактической структуры пакетов, а версия
# набора инструментов Rust и редакция Rust объявлены здесь один раз для всех участников.
#
# Это не отдельный пакет Rust: корень остаётся репозиторием колод, а Cargo задаёт
# границу для кода Rust на уровне репозитория.
[workspace]
members = [
    "tools/anki-e2e",
    "tools/anki-repo",
    "tools/asset-store",
    "tools/benchmark-contract",
    "tools/benchmark-history",
    "tools/benchmark-runner",
    "tools/japanese-lexicon",
    "tools/repository-maintenance",
    "tools/speech-enhance",
    "tools/speech-recognize",
]
resolver = "3"

# Единое объявление TOML для всех участников workspace и Renovate.
[workspace.dependencies]
toml = "1.0"

[workspace.package]
# Минимальная поддерживаемая версия Rust (MSRV) для всех участников рабочей области.
# Канонический владелец MSRV: rust-toolchain.toml повторяет её для rustup,
# а CI проверяет совпадение двух TOML и всех участников workspace.
rust-version = "1.99.1"
edition = "2024"
license = "AGPL-3.0-only"

# CI и локальная команда `cargo test` не требуют полноценных символов DWARF. При этом
# профиль `test` по-прежнему наследует `debug-assertions=true` и `overflow-checks=true`
# из профиля `dev`, поэтому диагностические проверки поведения не ослабляются.
[profile.test]
debug = 0

# `asset-store` содержит проверки растровых эталонов кандзи, нагружающие CPU.
# Умеренная оптимизация профиля `test` сокращает время этих проверок, не
# переводя всю рабочую область на более дорогую компиляцию, похожую на `release`.
[profile.test.package.asset-store]
opt-level = 1

# Инференс DeepFilterNet3 (tract) в неоптимизированной сборке примерно в
# десять раз медленнее: тесты speech-enhance с настоящей моделью и `cargo run`
# получают оптимизированные зависимости инференса, собственный код остаётся
# отлаживаемым. Профили `test` и `ci` наследуют эти настройки от `dev`.
[profile.dev.package.deep-filter-rt]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.tract-pulse]
opt-level = 3
[profile.dev.package.tract-pulse-opl]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
# Инференс CTC-моделей распознавания (speech-recognize) без оптимизации
# медленнее на порядок: тесты с настоящими весами и `cargo run` получают
# оптимизированное матричное умножение и собственный код инференса.
[profile.dev.package.speech-recognize]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
[profile.dev.package.thread-tree]
opt-level = 3

# CI на выделенных исполнителях использует один профиль и для тестового стенда,
# и для последующих проверок CLI на уровне репозитория. Это позволяет повторно
# использовать генерацию кода зависимостей вместо перехода из профиля `test`
# обратно в `dev` при каждом запуске `cargo run`.
[profile.ci]
inherits = "dev"
debug = 0

[profile.ci.package.asset-store]
opt-level = 1
