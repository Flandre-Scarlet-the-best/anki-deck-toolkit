name: Проверка конфигурации Renovate

on:
  pull_request:
    paths:
      - renovate.json
      - Cargo.toml
      - rust-toolchain.toml
      - .github/scripts/check_renovate_rust.py
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate-rust:
    name: Валидация и извлечение Rust
    runs-on: ubuntu-latest
    container:
      # Официальный образ с установленным Renovate и нативным RE2; digest
      # закрепляет всё дерево зависимостей без npm lifecycle scripts в job.
      image: ghcr.io/renovatebot/renovate@sha256:8006b5506fade5fc5d94b94a30c7a9fcbbd56099eead430ffba9cfb916a9b6d9
      options: --user 0
    timeout-minutes: 15
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # GitHub проверяет paths для всего PR, поэтому пустые коммиты ревью
      # повторно запускают job. Успех прежнего запуска переиспользуется
      # ТОЛЬКО при неизменном наборе входных файлов и версии проверяющего workflow.
      # Кэш создаётся лишь после полного успеха job; restore-keys нет.
      - name: Найти проверку для неизменных входных файлов
        id: proof
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renovate-proof/verified
          key: renovate-rust-proof-v1-${{ runner.os }}-${{ hashFiles('renovate.json', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'tools/**/Cargo.toml', '.github/scripts/check_renovate_rust.py', '.github/workflows/renovate-config.yml') }}
          lookup-only: true

      - name: Использовать ранее проверенное состояние
        if: steps.proof.outputs.cache-hit == 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Полный Renovate test уже прошёл на идентичных файлах; повторный запуск не нужен"

      - name: Проверить версию Renovate и нативный RE2
        if: steps.proof.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          test "$(renovate --version)" = 44.149.3
          /usr/local/renovate/node -e 'const RE2 = require("/usr/local/renovate/node_modules/re2"); if (!new RE2("^a+$").test("aaa")) process.exit(1)'

      - name: Проверить конфигурацию штатным валидатором
        if: steps.proof.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: renovate-config-validator --strict

      - name: Проверить настоящее извлечение и группировку Rust
        if: steps.proof.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          RENOVATE_BINARY: /usr/local/sbin/renovate
        run: python3 .github/scripts/check_renovate_rust.py

      - name: Сохранить доказательство успешной проверки
        if: steps.proof.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "${{ runner.temp }}/renovate-proof"
          printf 'Renovate 44.149.3: strict validation, extraction, lookup and fixtures PASS\n' > "${{ runner.temp }}/renovate-proof/verified"
