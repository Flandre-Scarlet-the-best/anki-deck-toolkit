name: Доверенный контракт описания PR
# На pull_request_target workflow и валидаторы берутся из доверенного base SHA;
# head PR не скачивается и не исполняется. API-данные обрабатываются как данные.
# Токен используется только для чтения и не сохраняется в рабочей копии.
# Изменение валидаторов в PR действует на эту проверку только после merge.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body-trusted:
    # Имя — контекст для ruleset; порядок его активации описан в
    # `.agents/skills/anki-git-workflow/references/pr-lifecycle.md`.
    name: Доверенная структура PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить доверенный валидатор из base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Проверить опубликованные описание и комментарий валидатором base
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_coderabbit_comment.py
