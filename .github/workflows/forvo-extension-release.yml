name: Выпуск адаптера Forvo

# Канал выпусков MV3-адаптера Forvo — GitHub Releases с тегами
# `forvo-extension-v<версия>` (независимо от других выпусков репозитория,
# `--latest=false`). Владелец версии — `version` в
# tools/asset-store/src/forvo/brave/extension/manifest.json.
#
# - `pull_request` — сухой прогон без секретов: тот же ZIP, что у `setup`,
#   проверка повышения версии при изменении исходников адаптера и сверка с уже
#   опубликованным выпуском той же версии. Ничего не публикует.
# - `push` в основную ветку (после принятого PR) и `workflow_dispatch` на ней —
#   публикация, если версия новая; если выпуск этой версии уже есть, только
#   побайтовая сверка (повторный запуск ничего не перетирает). Всё делается в
#   одном запуске: события, созданные `GITHUB_TOKEN`, другие workflow не
#   запускают, и последовательность выпуска на них не полагается.
#
# Подлинность для установщика — подпись Ed25519 метаданных ключом из секрета
# окружения `forvo-extension-release`; открытый ключ закреплён в
# release_keys.json исходников CLI. Без секрета или с ключом вне
# release_keys.json публикация не выполняется (BLOCKED), неподписанных выпусков
# нет. Процедура — docs/ru/asset-store/forvo-extension-release.md.
on:
  pull_request:
    paths: &inputs
      - 'tools/asset-store/src/forvo/brave/extension/**'
      - 'tools/asset-store/src/forvo/dom.js'
      - 'tools/asset-store/src/forvo/auth.js'
      - 'tools/asset-store/src/forvo/brave/package.rs'
      - 'tools/asset-store/src/forvo/brave/release.rs'
      - 'tools/asset-store/src/forvo/brave/release_keys.json'
      - 'tools/asset-store/src/bin/forvo_extension_release.rs'
      - '.github/workflows/forvo-extension-release.yml'
  push:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Публикации основной ветки идут строго по очереди и не отменяются.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  TOOL: target/ci/forvo-extension-release

jobs:
  check:
    name: Пакет и план выпуска адаптера Forvo
    if: >-
      github.event_name == 'pull_request'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Собрать инструмент выпуска
        run: cargo build --locked --profile ci -p asset-store --bin forvo-extension-release

      - name: Собрать пакет (тот же набор файлов, что у setup)
        run: |
          "$TOOL" build --out "$RUNNER_TEMP/dist" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --notes-out "$RUNNER_TEMP/notes.md" | tee "$RUNNER_TEMP/build.json"
          jq -e '.outcome == "ok" and .result.pairing_included == false' "$RUNNER_TEMP/build.json"

      - name: Проверить повышение версии при изменении исходников адаптера
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t sources < <("$TOOL" sources | jq -r '.result.paths[]')
          if git diff --quiet "$BASE" HEAD -- "${sources[@]}"; then
            echo "Исходники адаптера не изменены; повышение версии не требуется." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            base_version="$(git show "$BASE:tools/asset-store/src/forvo/brave/extension/manifest.json" | jq -r .version)"
            "$TOOL" check-bump --base-version "$base_version" | tee "$RUNNER_TEMP/bump.json"
            jq -e '.outcome == "ok"' "$RUNNER_TEMP/bump.json"
          fi

      - name: Получить список выпусков
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"

      - name: Составить план
        id: plan
        run: |
          "$TOOL" plan --releases "$RUNNER_TEMP/releases.json" | tee "$RUNNER_TEMP/plan.json"
          jq -e '.outcome == "ok"' "$RUNNER_TEMP/plan.json"
          {
            echo "action=$(jq -r .result.action "$RUNNER_TEMP/plan.json")"
            echo "version=$(jq -r .result.version "$RUNNER_TEMP/plan.json")"
            echo "tag=$(jq -r .result.tag "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Сверить с уже опубликованным выпуском той же версии
        if: steps.plan.outputs.action == 'verify_existing'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published" \
            --pattern 'forvo-extension-*'
          "$TOOL" compare --dir "$RUNNER_TEMP/dist" --published "$RUNNER_TEMP/published" | tee "$RUNNER_TEMP/compare.json"
          jq -e '.outcome == "ok"' "$RUNNER_TEMP/compare.json"

      - name: Итог
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          TAG: ${{ steps.plan.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTION" = publish ] && [ "$EVENT" = pull_request ]; then
            echo "После слияния в основную ветку будет опубликован $TAG." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$ACTION" = publish ]; then
            echo "Публикуется $TAG." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$TAG уже опубликован и совпадает с собранным пакетом; публикация не нужна." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Публикация выпуска адаптера Forvo
    needs: check
    if: >-
      needs.check.outputs.action == 'publish'
      && github.event_name != 'pull_request'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Секрет подписи доступен только этому окружению; правила защиты окружения
    # (ветка main, при желании — ручное одобрение) настраивает сопровождающий.
    environment: forvo-extension-release
    permissions:
      contents: write
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Собрать инструмент и пакет
        run: |
          cargo build --locked --profile ci -p asset-store --bin forvo-extension-release
          "$TOOL" build --out "$RUNNER_TEMP/dist" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --notes-out "$RUNNER_TEMP/notes.md"

      - name: Подписать метаданные
        env:
          FORVO_EXTENSION_SIGNING_KEY: ${{ secrets.FORVO_EXTENSION_SIGNING_KEY }}
        run: |
          "$TOOL" sign --dir "$RUNNER_TEMP/dist" | tee "$RUNNER_TEMP/sign.json"
          jq -e '.outcome == "ok" and .result.trusted == true' "$RUNNER_TEMP/sign.json"

      - name: Проверить выпуск как установщик (встроенный корень доверия)
        run: |
          "$TOOL" verify --dir "$RUNNER_TEMP/dist" | tee "$RUNNER_TEMP/verify.json"
          jq -e '.outcome == "ok"' "$RUNNER_TEMP/verify.json"

      - name: Повторить план с правом видеть черновики
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          "$TOOL" plan --releases "$RUNNER_TEMP/releases.json" | tee "$RUNNER_TEMP/plan.json"
          jq -e '.outcome == "ok"' "$RUNNER_TEMP/plan.json"
          echo "action=$(jq -r .result.action "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          # Неопубликованные черновики прежних прерванных запусков удаляются: тег у них ещё не создан.
          for id in $(jq -r '.result.drafts_to_replace[]?' "$RUNNER_TEMP/plan.json"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

      - name: Опубликовать
        if: steps.plan.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Черновик → файлы → публикация: тег создаётся только у полного выпуска.
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* --draft --target "$GITHUB_SHA" \
            --title "Адаптер Forvo $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          gh release edit "$TAG" --draft=false --latest=false

      - name: Проверить опубликованный выпуск
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published" \
            --pattern 'forvo-extension-*'
          "$TOOL" verify --dir "$RUNNER_TEMP/published" | tee "$RUNNER_TEMP/published-verify.json"
          jq -e '.outcome == "ok"' "$RUNNER_TEMP/published-verify.json"
          "$TOOL" compare --dir "$RUNNER_TEMP/dist" --published "$RUNNER_TEMP/published"
          echo "Опубликован $TAG." | tee -a "$GITHUB_STEP_SUMMARY"
