name: Контракт описания PR
# Кандидатная проверка использует код PR и не является независимым
# доказательством. Независимую проверку кодом base выполняет pr-body-trusted.yml.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body:
    name: Структура PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить валидатор
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # API возвращает опубликованные body и Conversation; событие задаёт HEAD.
      - name: Проверить опубликованные описание и комментарий PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_coderabbit_comment.py
