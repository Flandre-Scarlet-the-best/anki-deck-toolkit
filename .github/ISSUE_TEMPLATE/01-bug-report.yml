name: Ошибка
description: Ошибка CLI, проверок, обработки медиа, интеграций или другого компонента набора инструментов.
title: "[Ошибка]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Форма для воспроизводимых ошибок кода репозитория. Неверный перевод, чтение
        или ударение в самой карточке — не ошибка набора инструментов. Если инструмент
        неправильно обрабатывает карточку или проверка выдаёт неверный результат,
        используйте форму «Отчёт о проверке».

        Не прикладывайте целиком `deck.json`, медиа, корпус ресурсов или приватный
        журнал: это локальные данные пользователя. Достаточно минимального
        синтетического примера. Уязвимости сообщайте приватно, а не через Issue.
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - anki-repo — команды экспорта (inspect, validate, qa, review, edit, create, retire, migrate-*, visual-report и др.)
        - anki-repo anki — интеграция с Anki Desktop (AnkiConnect, CrowdAnki)
        - asset-store — kanji-assets, pitch-assets, pronunciation-assets, corpus gates
        - Браузерная инфраструктура (Chromium/Brave, jpdb, yarxi, Forvo)
        - anki-e2e — E2E-стенд
        - benchmark-contract / benchmark-runner / benchmark-history
        - anki-repository-maintenance
        - CI и скрипты .github
        - Agent Skills (.agents/skills)
        - Другое или не знаю
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия или commit
      description: Вывод `git rev-parse --short HEAD` или версия бинарника.
      placeholder: "например, 912c8d5d"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: ОС (Linux, WSL), версия Rust, при необходимости версия Anki или браузера.
      placeholder: "WSL2 Ubuntu 24.04, rustc 1.xx, Anki 25.x"
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Точные команды и входные данные. Пути к пользовательским колодам можно обобщить.
      placeholder: |
        1. cargo run -p anki-repo -- validate decks/output/<экспорт>
        2. ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло, включая код возврата.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти и на каком основании (документация, контракт, прежнее поведение).
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика
      description: Вывод команды, `--json`, backtrace (`RUST_BACKTRACE=1`), журналы. Уберите приватные данные.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Дополнительно
      description: Регрессия ли это, как часто воспроизводится, известные обходы.
