# Каталог сценариев бенчмаркинга Anki-decks.
#
# Здесь объявлен общий словарь профилей условий выполнения. Сценарии модулей
# лежат в scenarios/<модуль>.toml; новый модуль подключается новым файлом без
# правок этого файла и кода. Контракт и правила — docs/performance/benchmarks.md,
# проверка — `cargo run -p benchmark-contract -- validate`.
schema_version = 1
repository_root = ".."

[[profile]]
id = "cold"
cache = "cold"
network = "online"
description = "Перед каждым прогоном состояние, которым владеет модуль, сбрасывается его штатной командой. Общие кэши системы и других проектов не трогаются; что именно очищено, определяет сценарий."

[[profile]]
id = "warm"
cache = "warm"
network = "online"
description = "Повторный прогон без изменений входа после прогрева. Сеть разрешена."

[[profile]]
id = "offline-warm"
cache = "warm"
network = "offline"
description = "Тёплое состояние без сетевых обращений измеряемой серии. Исполнитель запускает серию без сетевого доступа; сетевая ошибка — неуспех прогона, а не повод разрешить сеть."

[[profile]]
id = "incremental"
cache = "incremental"
network = "online"
description = "Перед каждым прогоном изменяется только тот вход, который должен вызвать частичную пересборку; остальные кэши тёплые."
