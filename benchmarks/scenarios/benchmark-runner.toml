[[scenario]]
id = "benchmark-runner.calibration-io"
title = "Контролируемый блочный ввод-вывод"
revision = 1
kind = "short-cli"
status = "executable"
description = "Создание нового файла 16 MiB, fsync, POSIX_FADV_DONTNEED только этого файла, проверенное чтение и удаление. Совет по кэшу может быть проигнорирован; байты io.stat не обязаны равняться 16 MiB из-за метаданных и нескольких устройств."
measured = "Один release-запуск benchmark-workload: весь файловый цикл. Сборка и прогрев не входят; метрики собственной cgroup включают Hyperfine."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "benchmark-runner", bin = "benchmark-workload" }
args = ["--file-io", "target/benchmark-workloads/runner-io.bin", "16"]
expect_exit_codes = [0]

[scenario.runs]
warmup = 1
min_runs = 5
max_runs = 20
single_run_allowed = false
run_timeout_seconds = 60
total_budget_seconds = 600

[[scenario.profile]]
id = "warm"
cache_definition = "Бинарник прогрет; файл создаётся новым, синхронизируется, его собственные чистые страницы запрашиваются к удалению из кэша перед чтением. Общие кэши не очищаются."
cleared = ["собственный файл после каждого успешного запуска"]
retained = ["общие кэши ОС и файловой системы"]

