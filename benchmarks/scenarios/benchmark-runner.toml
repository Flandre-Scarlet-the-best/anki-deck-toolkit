# Калибровка самого измерителя: синтетическая нагрузка benchmark-workload с
# заранее известной ценой (процессорное время, число потоков, резидентная
# память). Сравнение измеренного с известным проверяет точность и охват
# метрик, а пары серий с опросом и без него (--no-sampling) и сценарий без
# дополнительных метрик — накладные расходы сборщика. Эти сценарии не
# описывают производительность asset-store, anki-repo или Anki. Методика и
# снимки — tools/benchmark-runner/performance.md.
schema_version = 1
module = "benchmark-runner"

[[scenario]]
id = "benchmark-runner.calibration-noop"
title = "Пустая цель"
revision = 2
kind = "short-cli"
status = "executable"
description = "benchmark-workload без действий: запуск и выход процесса. Нижняя граница времени и памяти, разрешение счётчиков и цена Hyperfine в значениях группы."
measured = "Один запуск собранного release-бинарника benchmark-workload от старта процесса до выхода; сборка и прогревы в интервал не входят."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "benchmark-runner", bin = "benchmark-workload" }
args = []
expect_exit_codes = [0]

[scenario.runs]
warmup = 3
min_runs = 20
max_runs = 200
single_run_allowed = false
run_timeout_seconds = 60
total_budget_seconds = 1800

[[scenario.profile]]
id = "warm"
cache_definition = "Нагрузка не читает файлов, кроме собственного исполняемого файла; он в page cache после прогревов."
cleared = []
retained = ["page cache ОС с исполняемым файлом benchmark-workload"]

[[scenario.metric]]
metric = "time_wall_clock"
scope = "command"
source = "hyperfine"
required = true

[[scenario.metric]]
metric = "time_user"
scope = "process-tree-waited"
source = "hyperfine"
required = false

[[scenario.metric]]
metric = "time_system"
scope = "process-tree-waited"
source = "hyperfine"
required = false

[[scenario.metric]]
metric = "time_cpu"
scope = "process-tree-waited"
source = "hyperfine"
required = false

[[scenario.metric]]
metric = "memory_peak_resident"
scope = "largest-process-in-tree"
source = "hyperfine"
required = false

[[scenario.metric]]
metric = "instructions"
scope = "process-tree-waited"
source = "hyperfine"
required = false
description = "Без доступа к perf_event метрика не поддерживается; причина указывается в результате."

[[scenario.metric]]
metric = "cpu_time_cgroup"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Подгруппа прогона: цель и процесс Hyperfine; превышение над time_cpu — цена Hyperfine."

[[scenario.metric]]
metric = "memory_peak_cgroup"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "memory.peak подгруппы прогона; страницы, уже начисленные другой группе (например, кэш исполняемого файла), сюда не входят."

[[scenario.metric]]
metric = "cpu_utilization_mean"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "cpu_time_cgroup, делённое на время жизни подгруппы прогона: весь вызов Hyperfine, включая цель, до остановки сэмплера."

[[scenario.metric]]
metric = "cpu_utilization_peak"
scope = "host"
source = "procfs"
required = false
sample_interval_seconds = 0.05
description = "Опрос /proc/stat всей системы по интервалам: наблюдение хостовой нагрузки, не верхняя граница пиковой загрузки цели."

[[scenario.metric]]
metric = "memory_host_peak_increase"
scope = "host"
source = "procfs"
required = false
sample_interval_seconds = 0.05
description = "Наибольшее снижение MemAvailable за прогон по всей системе: наблюдение хоста, не граница; включает чужие выделения и смещается одновременными освобождениями."

[[scenario.metric]]
metric = "io_read_bytes"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Учтённый ядром блочный I/O: сумма по устройствам io.stat; не логический объём нагрузки. Для контейнера недоступен при потере итогового снимка группы."

[[scenario.metric]]
metric = "io_write_bytes"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Учтённый ядром блочный I/O: сумма по устройствам io.stat; не логический объём нагрузки. Для контейнера недоступен при потере итогового снимка группы."

[[scenario.metric]]
metric = "io_read_operations"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Учтённый ядром блочный I/O: сумма по устройствам io.stat; не логический объём нагрузки. Для контейнера недоступен при потере итогового снимка группы."

[[scenario.metric]]
metric = "io_write_operations"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Учтённый ядром блочный I/O: сумма по устройствам io.stat; не логический объём нагрузки. Для контейнера недоступен при потере итогового снимка группы."

[scenario.environment]
record = ["os", "arch", "kernel_release", "virtualization", "cpu_model", "logical_cpus", "memory_total_bytes", "module_version", "rustc_version", "hyperfine_version"]
comparable = ["os", "arch", "virtualization", "cpu_model", "logical_cpus"]

