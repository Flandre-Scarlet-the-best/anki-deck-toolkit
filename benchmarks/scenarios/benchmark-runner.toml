[[scenario]]
id = "benchmark-runner.calibration-memory"
title = "Известная резидентная память"
revision = 2
kind = "short-cli"
status = "executable"
description = "Процесс записывает каждую страницу блока 256 MiB и держит его 200 мс. Ожидается memory_peak_resident ≈ 256 MiB плюс база процесса, memory_peak_cgroup того же порядка, memory_host_peak_increase — наблюдение MemAvailable по всей системе, не верхняя граница памяти цели."
measured = "Один запуск собранного release-бинарника benchmark-workload от старта процесса до выхода; сборка и прогревы в интервал не входят."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "benchmark-runner", bin = "benchmark-workload" }
args = ["--alloc-mib", "256", "--sleep-ms", "200"]
expect_exit_codes = [0]

