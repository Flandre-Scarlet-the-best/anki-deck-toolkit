description = "Четыре потока по 1000 мс собственного процессорного времени. Ожидается time_cpu ≈ 4 с, time_wall_clock ≈ 1 с при четырёх свободных ядрах, cpu_utilization_mean подгруппы ≈ 4 ядра. Длинный прогон для оценки опроса /proc и cgroup."
measured = "Один запуск собранного release-бинарника benchmark-workload от старта процесса до выхода; сборка и прогревы в интервал не входят."
platforms = ["linux"]

