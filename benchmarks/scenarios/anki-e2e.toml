[[scenario.requires]]
kind = "network"
purpose = "GitHub Releases API и архив Anki при выборе релиза, Docker Hub и зеркала Ubuntu при сборке образов"
profiles = ["warm"]

[[scenario.metric]]
metric = "io_read_bytes"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Учтённый ядром блочный I/O: сумма по устройствам io.stat; не логический объём нагрузки. Для контейнера недоступен при потере итогового снимка группы."

