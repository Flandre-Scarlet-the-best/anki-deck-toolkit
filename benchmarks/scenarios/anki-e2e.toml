# Сценарии E2E-стенда Anki Desktop. Контракт стенда — docs/ru/anki-e2e/README.md,
# журнал замеров — docs/ru/anki-e2e/performance.md.
schema_version = 1
module = "anki-e2e"

[[scenario]]
id = "anki-e2e.forvo-batch"
title = "Изолированный полный Forvo MV3 пакет и последовательная сессия"
revision = 2
kind = "long-e2e"
status = "executable"
description = "Реальный CLI, SafeBatchRuntime и MV3-расширение в настоящем тестовом Chromium против локального HTTPS fixture. Разные синтетические японские пары, контроль SHA/evidence/import, идемпотентное возобновление (resume) и ресурсы между пакетами. Живой Forvo не используется."
measured = "Весь вызов anki-e2e browser: генерация HTTPS/MP3 fixture, setup адаптера, запуск временного браузера, batch_count последовательных batch-start по batch_items, проверка store/blob/evidence и повторный resume каждого пакета, наблюдения ресурсов и закрытие браузера. Сборка обоих release-бинарников вне интервала. batch_wall_s в module-report отдельно охватывает только CLI batch-start."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "anki-e2e", bin = "anki-e2e" }
args = ["browser", "--scenarios", "cli_batch_load", "--batch-items", "{param.batch_items}", "--batch-count", "{param.batch_count}", "--chrome", "{param.chrome}", "--declared-storage", "{param.declared_storage}"]
expect_exit_codes = [0]

[scenario.target.env]
inherit = ["PATH", "HOME"]

[[scenario.parameter]]
name = "batch_items"
description = "Разных японских пар в каждом пакете; рекомендуемые масштабы 10/50/128."
default = "10"
choices = ["10", "50", "128"]
record = true
affects_comparability = true

[[scenario.parameter]]
name = "batch_count"
description = "Самостоятельных последовательных пакетов в одном браузерном профиле; пары между пакетами не повторяются."
default = "1"
choices = ["1", "3", "8"]
record = true
affects_comparability = true

[[scenario.parameter]]
name = "chrome"
description = "Исполняемый файл тестового Chromium; личные профили не используются. Фактическая версия записывается из module-report."
required = true
record = false
affects_comparability = false

[[scenario.parameter]]
name = "declared_storage"
description = "Физический накопитель каталога прогона по заявлению оператора, например модель NVMe. Нужен, только когда стенд не наблюдает накопитель сам (виртуальная машина, в том числе WSL2, overlay контейнера, сетевая ФС): иначе факт storage неизвестен и сравнение блокируется. Наблюдаемый накопитель заявлением не заменяется. Пустое значение — не заявлено."
default = ""
record = false
affects_comparability = false

[[scenario.input]]
id = "fixture"
kind = "repo-file"
role = "workload"
identity = "file-sha256"
path = "tools/anki-e2e/src/browser/fixture.rs"
description = "Детерминированный генератор ограниченного корпуса разных японских пар и record_id; размеры пакетов дополнительно закреплены параметрами."
size = [{ name = "generator_bytes", unit = "byte", description = "Размер исходника генератора fixture.", measure = { kind = "tree-bytes" } }]

[[scenario.input]]
id = "fixture-audio"
kind = "downloaded-artifact"
role = "workload"
identity = "file-sha256"
report_identity = "/fixture/load_corpus_sha256"
description = "Артефакт fixture, синтезированный локально (внешних загрузок нет): load-corpus.json с упорядоченными парами, record_id и SHA каждого отличающегося MP3. Идентичность подтверждается каждым отчётом."
size = [{ name = "pairs", unit = "count", description = "Разных пар с отдельными оригинальными MP3.", measure = { kind = "report", pointer = "/fixture/load_pairs" } }]

[[scenario.input]]
id = "toolkit"
kind = "repo-tree"
role = "subject"
identity = "content-tree-sha256"
description = "Снимок исходников, из которых исполнитель собирает production CLI и browser E2E."

[[scenario.setup]]
description = "Гарантированная сборка production pronunciation-assets в той же release-области Cargo, что anki-e2e; E2E находит его рядом со своим бинарником."
program = { kind = "cargo-bin", package = "asset-store", bin = "pronunciation-assets" }
args = ["--help"]
touches = "read-only"
timeout_seconds = 30

[scenario.runs]
warmup = 1
min_runs = 2
max_runs = 5
single_run_allowed = false
run_timeout_seconds = 10800
total_budget_seconds = 86400

[[scenario.profile]]
id = "warm"
cache_definition = "Прогреты бинарники и page cache ОС одним неизмеряемым вызовом. Каждый вызов создаёт новый уникальный каталог прогона, новый пустой AssetStore и временный профиль браузера: сохранённые acquisition/checkpoint между вызовами никогда не переиспользуются. Внутри длительной сессии store и профиль общие; новые пары в каждом самостоятельном пакете требуют новых загрузок. Профиль warm относится к ОС/бинарникам, получение всегда холодное по данным."
cleared = []
retained = ["page cache ОС", "собранные release-бинарники", "между пакетами одного вызова: временный профиль и store с предыдущими разными парами"]

[[scenario.metric]]
metric = "time_wall_clock"
scope = "command"
source = "hyperfine"
required = true

[[scenario.metric]]
metric = "time_cpu"
scope = "process-tree-waited"
source = "hyperfine"
required = false

[[scenario.metric]]
metric = "memory_peak_resident"
scope = "largest-process-in-tree"
source = "hyperfine"
required = false
description = "Максимальный отдельный процесс дерева; не сумма Rust и браузера. Раздельные выборки есть в module-report."

[[scenario.metric]]
metric = "cpu_time_cgroup"
scope = "cgroup"
source = "cgroup-v2"
required = false

[[scenario.metric]]
metric = "memory_peak_cgroup"
scope = "cgroup"
source = "cgroup-v2"
required = false

[[scenario.metric]]
metric = "module_counter"
scope = "module-report"
source = "module-report"
label = "imports"
pointer = "/scenarios/*/evidence/batches/*/imports"
required = false

[[scenario.metric]]
metric = "module_counter"
scope = "module-report"
source = "module-report"
label = "downloads"
pointer = "/scenarios/*/evidence/batches/*/requests_before_resume/*"
required = false

[[scenario.metric]]
metric = "module_counter"
scope = "module-report"
source = "module-report"
label = "acquire_ms"
pointer = "/scenarios/*/evidence/batches/*/diagnostics/stage_duration_ms/acquire/*"
required = false

[[scenario.metric]]
metric = "module_counter"
scope = "module-report"
source = "module-report"
label = "import_mp3_ms"
pointer = "/scenarios/*/evidence/batches/*/diagnostics/stage_duration_ms/import_mp3/*"
required = false

[scenario.module_report]
runs_dir = "target/anki-e2e/browser-runs"
report = "report.json"
description = "Штатный browser report.json: отдельный каталог для каждого вызова, все исходные наблюдения и проверки внутри evidence."

[[scenario.requires]]
kind = "executable"
name = "ffmpeg"

[[scenario.requires]]
kind = "executable"
name = "ffprobe"

[[scenario.requires]]
kind = "executable"
name = "openssl"

[scenario.environment]
record = ["os", "arch", "kernel_release", "virtualization", "cpu_model", "logical_cpus", "memory_total_bytes", "module_version", "rustc_version", "hyperfine_version", "browser_version", "storage", "guest_storage"]
comparable = ["os", "arch", "virtualization", "cpu_model", "logical_cpus", "browser_version", "storage", "guest_storage"]

[[scenario.environment.fact]]
name = "browser_version"
description = "Фактическая версия исполняемого файла тестового Chromium."
report = ["/browser/version"]

[[scenario.environment.fact]]
name = "storage"
description = "Физический накопитель каталога прогона, где лежат store, профиль и fixture, вместе с происхождением: provenance=observed — модель прочитана стендом в sysfs вне виртуальной машины; provenance=operator_declared — накопитель стенду не виден и описан оператором параметром declared_storage, аппаратно не подтверждён. Разное происхождение даёт разные значения, поэтому наблюдаемое и заявленное описания не сопоставляются друг с другом; без наблюдения и заявления факт неизвестен."
report = ["/storage/provenance", "/storage/physical"]

[[scenario.environment.fact]]
name = "guest_storage"
description = "Что стенд сам наблюдает для каталога прогона: тип ФС и модели блочных устройств ядра, на котором он работает (в виртуальной машине — виртуальные устройства). Серийные номера не записываются."
report = ["/storage/guest"]

[[scenario]]
id = "anki-e2e.forvo-enospc"
title = "Отказ полного Forvo-пакета при ENOSPC и восстановление"
revision = 1
kind = "long-e2e"
status = "executable"
description = "Настоящий CLI и MV3 против HTTPS fixture: первая запись импортируется, при активной второй загрузке отдельная tmpfs заполняется до ENOSPC; прежнее состояние проверяется, место освобождается, resume заканчивает пакет."
measured = "Весь anki-e2e browser cli_batch_enospc: подготовка fixture/профиля, реальный отказ записи, завершение диагностики CLI, восстановление без повторной загрузки первой записи, постусловия, копирование свидетельств, очистка собственного store с tmpfs и закрытие браузера. Монтирование оператором и сборка обоих release-бинарников вне интервала."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "anki-e2e", bin = "anki-e2e" }
args = ["browser", "--scenarios", "cli_batch_enospc", "--chrome", "{param.chrome}", "--fault-volume", "{param.fault_volume}"]
expect_exit_codes = [0]

[scenario.target.env]
inherit = ["PATH", "HOME"]

[[scenario.parameter]]
name = "chrome"
description = "Исполняемый файл тестового Chromium; фактическая версия — из отчёта."
required = true
record = false
affects_comparability = false

[[scenario.parameter]]
name = "fault_volume"
description = "Заранее выделенная пустая отдельная tmpfs <=64 MiB; обычные файловые системы отклоняются. Каждый успешный вызов сохраняет свидетельства в отчёте и удаляет только созданный им store, оставляя том пустым."
required = true
record = false
affects_comparability = false

[[scenario.input]]
id = "fixture"
kind = "repo-file"
role = "workload"
identity = "file-sha256"
path = "tools/anki-e2e/src/browser/fixture.rs"
description = "Генератор страниц и двух отдельных записей с оригинальными синтетическими MP3."
size = [{ name = "generator_bytes", unit = "byte", description = "Размер исходника fixture.", measure = { kind = "tree-bytes" } }]

[[scenario.input]]
id = "toolkit"
kind = "repo-tree"
role = "subject"
identity = "content-tree-sha256"
description = "Исходники реального CLI, общей диагностики и стенда."

[[scenario.setup]]
description = "Сборка production CLI рядом с anki-e2e."
program = { kind = "cargo-bin", package = "asset-store", bin = "pronunciation-assets" }
args = ["--help"]
touches = "read-only"
timeout_seconds = 30

[scenario.runs]
warmup = 1
min_runs = 2
max_runs = 5
single_run_allowed = false
run_timeout_seconds = 600
total_budget_seconds = 5400

[[scenario.profile]]
id = "warm"
cache_definition = "Прогретая ОС и бинарники, каждый вызов начинает с пустой выделенной tmpfs и нового временного браузерного профиля; сохранённые результаты между вызовами не переиспользуются."
cleared = []
retained = ["page cache ОС", "release-бинарники", "сама выделенная оператором пустая tmpfs"]

[[scenario.metric]]
metric = "time_wall_clock"
scope = "command"
source = "hyperfine"
required = true

[[scenario.metric]]
metric = "time_cpu"
scope = "process-tree-waited"
source = "hyperfine"
required = false

[[scenario.metric]]
metric = "memory_peak_resident"
scope = "largest-process-in-tree"
source = "hyperfine"
required = false

[scenario.module_report]
runs_dir = "target/anki-e2e/browser-runs"
report = "report.json"
description = "Штатные отчёт и копия store-evidence каждого прогона."

[[scenario.requires]]
kind = "executable"
name = "ffmpeg"

[[scenario.requires]]
kind = "executable"
name = "ffprobe"

[[scenario.requires]]
kind = "executable"
name = "openssl"

[scenario.environment]
record = ["os", "arch", "kernel_release", "virtualization", "cpu_model", "logical_cpus", "memory_total_bytes", "module_version", "rustc_version", "hyperfine_version", "browser_version", "volume_capacity"]
comparable = ["os", "arch", "virtualization", "cpu_model", "logical_cpus", "browser_version", "volume_capacity"]

[[scenario.environment.fact]]
name = "browser_version"
description = "Фактическая версия Chromium."
report = ["/browser/version"]

[[scenario.environment.fact]]
name = "volume_capacity"
description = "Фактическая ёмкость отдельной tmpfs в байтах."
report = ["/scenarios/0/evidence/volume_capacity_bytes"]

[[scenario]]
id = "anki-e2e.full"
title = "Полный набор E2E-сценариев стенда"
revision = 2
kind = "long-e2e"
status = "executable"
description = "Штатный полный прогон стенда: smoke, addons, patch, crowdanki, process, errors в одном изолированном контейнере с официальной Linux Anki Desktop."
measured = "Весь вызов `anki-e2e full`: выбор релиза Anki (индекс GitHub, загрузка или повторная сверка архива), снимок исходников, сборка образов Anki и запуска, шесть сценариев в контейнере и проверенная уборка контейнера. Сборка исполняемого файла anki-e2e на хосте в интервал не входит."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "anki-e2e", bin = "anki-e2e" }
args = ["full"]
expect_exit_codes = [0]

[scenario.target.env]
inherit = ["PATH", "HOME", "DOCKER_HOST"]

[[scenario.input]]
id = "toolkit"
kind = "repo-tree"
role = "subject"
identity = "content-tree-sha256"
description = "Снимок файлов рабочей копии, которые отслеживает или не игнорирует Git; хэш дерева стенд пишет в report.json."

[[scenario.input]]
id = "anki-archive"
kind = "downloaded-artifact"
role = "workload"
identity = "file-sha256"
description = "Официальный архив Linux Anki Desktop, выбранный стендом; SHA-256 и размер — из report.json."
report_identity = "/artifact/sha256"
size = [{ name = "archive_bytes", unit = "byte", description = "Размер архива Anki в байтах.", measure = { kind = "report", pointer = "/artifact/size" } }]

[scenario.runs]
warmup = 0
min_runs = 2
max_runs = 3
single_run_allowed = true
run_timeout_seconds = 10800
total_budget_seconds = 43200

[[scenario.profile]]
id = "cold"
cache_definition = "Перед каждым прогоном `anki-e2e clean --images --cache`: удалены образы стенда, архивы Anki в cache/, снимки исходников в build/ и BuildKit cache mounts anki-e2e-cargo-registry и anki-e2e-cargo-target. Холодный для модуля, но не для системы."
cleared = ["образы стенда с меткой io.github.anki-deck-toolkit.e2e=1", "кэш архивов Anki target/anki-e2e/cache", "снимки исходников target/anki-e2e/build", "BuildKit cache mounts anki-e2e-cargo-registry и anki-e2e-cargo-target"]
retained = ["общий слоевой кэш BuildKit демона", "базовые образы ubuntu и rust", "page cache ОС", "собранный на хосте anki-e2e"]

[[scenario.profile.prepare]]
description = "Штатная очистка ресурсов стенда; общие кэши Docker не затрагиваются."
program = { kind = "cargo-bin", package = "anki-e2e", bin = "anki-e2e" }
args = ["clean", "--images", "--cache"]
touches = "module-owned"
timeout_seconds = 1800

[[scenario.profile]]
id = "warm"
cache_definition = "Образы стенда, архив выбранной версии Anki и cache mounts Cargo уже существуют после одного неизмеряемого прогона full в setup; исходники между прогонами не меняются, поэтому образ запуска не пересобирается."
cleared = []
retained = ["образы стенда", "архив Anki в кэше стенда", "BuildKit cache mounts Cargo", "снимок исходников"]

[[scenario.profile.setup]]
description = "Прогрев: один полный прогон, который собирает образы и заполняет кэши; в серию не входит."
program = { kind = "cargo-bin", package = "anki-e2e", bin = "anki-e2e" }
args = ["full"]
touches = "module-owned"
timeout_seconds = 10800

[[scenario.metric]]
metric = "time_wall_clock"
scope = "command"
source = "hyperfine"
required = true

[[scenario.metric]]
metric = "time_cpu"
scope = "process-tree-waited"
source = "hyperfine"
required = false
description = "Только runner на хосте и дождавшиеся им потомки (docker CLI). Процессы контейнера и шаги BuildKit сюда не входят: их потребление — метрики cgroup и хоста."

[[scenario.metric]]
metric = "memory_peak_resident"
scope = "largest-process-in-tree"
source = "hyperfine"
required = false
description = "Пик RSS runner или его дождавшегося потомка, а не контейнера."

[[scenario.metric]]
metric = "memory_peak_cgroup"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "memory.peak scope контейнера сценариев; контейнер удаляется в конце, поэтому значение сэмплируется во время прогона."

[[scenario.metric]]
metric = "cpu_time_cgroup"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "usage_usec scope контейнера сценариев."

[[scenario.metric]]
metric = "cpu_utilization_peak"
scope = "cgroup"
source = "cgroup-v2"
required = false
sample_interval_seconds = 1.0
description = "Наибольшая загрузка контейнера сценариев за секунду."

[[scenario.metric]]
metric = "cpu_utilization_peak"
scope = "host"
source = "procfs"
required = false
sample_interval_seconds = 1.0
description = "Сборка образов идёт вне cgroup прогона. /proc/stat показывает выборочное наблюдение всего хоста и не является верхней границей загрузки сборки."

[[scenario.metric]]
metric = "memory_host_peak_increase"
scope = "host"
source = "procfs"
required = false
sample_interval_seconds = 1.0
description = "Выборочное наблюдение снижения MemAvailable по всему хосту; это не верхняя граница памяти сборки образов."

[[scenario.metric]]
metric = "phase_duration"
scope = "phase"
source = "module-log"
label = "release"
required = false
resolution = 1.0
description = "Сейчас метрика не поддерживается: модуль не публикует машинно-читаемые метки фаз; длительность не выводится из текста runner.log."

[[scenario.metric]]
metric = "phase_duration"
scope = "phase"
source = "module-log"
label = "anki-image"
required = false
resolution = 1.0
description = "Сейчас метрика не поддерживается: модуль не публикует машинно-читаемые метки фаз; длительность не выводится из текста runner.log."

[[scenario.metric]]
metric = "phase_duration"
scope = "phase"
source = "module-log"
label = "run-image"
required = false
resolution = 1.0
description = "Сейчас метрика не поддерживается: модуль не публикует машинно-читаемые метки фаз; длительность не выводится из текста runner.log."

[[scenario.metric]]
metric = "phase_duration"
scope = "phase"
source = "module-log"
label = "scenarios"
required = false
resolution = 1.0
description = "Сейчас метрика не поддерживается: модуль не публикует машинно-читаемые метки фаз; длительность не выводится из текста runner.log."

[[scenario.metric]]
metric = "module_counter"
scope = "module-report"
source = "module-report"
label = "commands_started"
required = false
pointer = "/scenarios/*/commands_started"
description = "Сумма commands_started по сценариям report.json: число запусков anki-repo."

[[scenario.metric]]
metric = "disk_usage"
scope = "path"
source = "filesystem"
label = "work-cache"
required = false
path = "target/anki-e2e/cache"
description = "Размер target/anki-e2e/cache после прогона."

[scenario.module_report]
runs_dir = "target/anki-e2e/runs"
report = "report.json"
description = "Каждый вызов стенда создаёт новый каталог runs/<id> с report.json (контракт — docs/ru/anki-e2e/README.md)."

[scenario.container]
label = "io.github.anki-deck-toolkit.e2e.kind=container"
owner_pid_label = "io.github.anki-deck-toolkit.e2e.host-pid"
description = "Контейнер сценариев, который стенд создаёт на каждый прогон и удаляет в конце."

[[scenario.requires]]
kind = "docker"

[[scenario.requires]]
kind = "network"
purpose = "GitHub Releases API и архив Anki, AnkiWeb для сценариев аддонов, Docker Hub и зеркала Ubuntu для сборки образов"
profiles = ["cold", "warm"]

[[scenario.metric]]
metric = "io_read_bytes"
