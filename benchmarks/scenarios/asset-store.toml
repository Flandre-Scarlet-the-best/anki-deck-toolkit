# Сценарии файлового ядра asset-store: настоящие операции AssetStore и
# SafeBatchRuntime над детерминированным синтетическим корпусом. Исполнитель
# нагрузки — asset-store-bench (docs/ru/asset-store/README.md), спецификации
# объёмов — benchmarks/workloads/asset-store/*.toml, методика и снимки —
# docs/ru/asset-store/performance.md.
#
# Эталон строится шагом setup штатной публикацией ingest_verified в
# игнорируемом Git каталоге target/benchmark-workloads/asset-store; cleanup
# удаляет рабочую копию, эталон переиспользуется только той же сборкой. Изменяющие сценарии перед каждым прогоном восстанавливают рабочую
# копию из эталона (prepare), а постусловия проверяют вне измеряемого интервала
# (conclude). Браузерные и сетевые пути (Chromium, Yarxi, JPDB, LLM) здесь не
# измеряются.
schema_version = 1
module = "asset-store"

[[scenario]]
id = "asset-store.verify-integrity"
title = "Проверка целостности корпуса"
revision = 2
kind = "short-cli"
status = "executable"
description = "Открытие существующего хранилища (проверка владельца, манифестов, сверка runtime-границы) и verify_integrity: манифест и наличие каждого файла под разделяемой блокировкой. Байты файлов не хешируются."
measured = "Один запуск собранного release-бинарника asset-store-bench от старта процесса до выхода: open_existing и verify_integrity над эталоном. Построение эталона, прогревы и проверка постусловия в интервал не входят."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "asset-store", bin = "asset-store-bench" }
args = ["run", "verify-integrity", "--spec", "{input.workload}", "--workdir", "target/benchmark-workloads/asset-store"]
expect_exit_codes = [0]

[scenario.target.env]
inherit = ["PATH"]

[[scenario.parameter]]
name = "workload_spec"
description = "Файл спецификации нагрузки, например benchmarks/workloads/asset-store/kanji-medium.toml. Путь не публикуется: нагрузку в результате представляют SHA-256 файла и объём из пробы."
required = true
record = false
affects_comparability = false

[[scenario.input]]
id = "workload"
kind = "external-path"
role = "workload"
identity = "file-sha256"
parameter = "workload_spec"
description = "Спецификация синтетического корпуса: домен, зерно, число записей, размеры изображений и пакетного состояния. Версия генератора входит в файл, поэтому SHA-256 файла описывает и содержимое корпуса."
size = [
    { name = "records", unit = "count", description = "Записей корпуса: идентичности и их форматные варианты.", measure = { kind = "probe", pointer = "/records" } },
    { name = "corpus_bytes", unit = "byte", description = "Суммарный размер байтов всех записей корпуса.", measure = { kind = "probe", pointer = "/corpus_bytes" } },
]

[scenario.input.probe]
description = "asset-store-bench describe порождает корпус в памяти и сообщает его объём; на диск не пишет."
program = { kind = "cargo-bin", package = "asset-store", bin = "asset-store-bench" }
args = ["describe", "--spec", "{input.workload}"]
touches = "read-only"
timeout_seconds = 300

[[scenario.setup]]
description = "Эталон серии: корпус штатной публикацией ingest_verified, входящие файлы и пакетное состояние. Эталон прежней серии переиспользуется, только если его построил тот же исполняемый файл по той же спецификации и его дерево совпало с записанным; иначе он строится заново."
program = { kind = "cargo-bin", package = "asset-store", bin = "asset-store-bench" }
args = ["setup", "--spec", "{input.workload}", "--workdir", "target/benchmark-workloads/asset-store"]
touches = "scenario-temp"
timeout_seconds = 1800

[[scenario.cleanup]]
description = "Удаление рабочей копии; эталон остаётся для следующей серии той же сборки и спецификации (полная очистка — asset-store-bench clean без --keep-template). Каталог без маркера asset-store-bench не трогается."
program = { kind = "cargo-bin", package = "asset-store", bin = "asset-store-bench" }
args = ["clean", "--workdir", "target/benchmark-workloads/asset-store", "--keep-template"]
touches = "scenario-temp"
timeout_seconds = 300

[scenario.runs]
warmup = 2
min_runs = 10
max_runs = 100
single_run_allowed = false
run_timeout_seconds = 120
total_budget_seconds = 1800

[[scenario.profile]]
id = "warm"
cache_definition = "Операция только читает эталон серии; его файлы в page cache после прогревочных прогонов. Глобальный page cache не сбрасывается."
cleared = []
retained = ["эталон серии", "page cache ОС"]

[[scenario.profile.conclude]]
description = "Постусловие: SHA-256 дерева эталона не изменился — операция действительно только читает."
program = { kind = "cargo-bin", package = "asset-store", bin = "asset-store-bench" }
args = ["verify", "verify-integrity", "--spec", "{input.workload}", "--workdir", "target/benchmark-workloads/asset-store"]
touches = "read-only"
timeout_seconds = 600

[[scenario.metric]]
metric = "time_wall_clock"
scope = "command"
source = "hyperfine"
required = true

[[scenario.metric]]
metric = "time_user"
scope = "process-tree-waited"
source = "hyperfine"
required = false

[[scenario.metric]]
metric = "time_system"
scope = "process-tree-waited"
source = "hyperfine"
required = false
description = "Время ядра: файловые операции, fsync, блокировки."

[[scenario.metric]]
metric = "memory_peak_resident"
scope = "largest-process-in-tree"
source = "hyperfine"
required = false

[[scenario.metric]]
metric = "instructions"
scope = "process-tree-waited"
source = "hyperfine"
required = false
description = "Без доступа к perf_event метрика не поддерживается; причина указывается в результате."

[[scenario.metric]]
metric = "cpu_time_cgroup"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Процессорное время подгруппы прогона: цель и процесс Hyperfine."

[[scenario.metric]]
metric = "memory_peak_cgroup"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "memory.peak подгруппы прогона: включает page cache, записанный целью, и Hyperfine; это не RSS процесса."

[[scenario.metric]]
metric = "cpu_utilization_peak"
scope = "host"
source = "procfs"
required = false
sample_interval_seconds = 0.05
description = "Опрос /proc/stat всей системы: выборочное наблюдение хостовой нагрузки, не верхняя граница пиковой загрузки цели."

[[scenario.metric]]
metric = "io_read_bytes"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Учтённый ядром блочный I/O: сумма по устройствам io.stat; не логический объём нагрузки. Для контейнера недоступен при потере итогового снимка группы."

[[scenario.metric]]
metric = "io_write_bytes"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Учтённый ядром блочный I/O: сумма по устройствам io.stat; не логический объём нагрузки. Для контейнера недоступен при потере итогового снимка группы."

[[scenario.metric]]
metric = "io_read_operations"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Учтённый ядром блочный I/O: сумма по устройствам io.stat; не логический объём нагрузки. Для контейнера недоступен при потере итогового снимка группы."

[[scenario.metric]]
metric = "io_write_operations"
scope = "cgroup"
source = "cgroup-v2"
required = false
description = "Учтённый ядром блочный I/O: сумма по устройствам io.stat; не логический объём нагрузки. Для контейнера недоступен при потере итогового снимка группы."

[scenario.environment]
record = ["os", "arch", "kernel_release", "virtualization", "cpu_model", "logical_cpus", "memory_total_bytes", "module_version", "rustc_version", "hyperfine_version"]
comparable = ["os", "arch", "virtualization", "cpu_model", "logical_cpus"]

