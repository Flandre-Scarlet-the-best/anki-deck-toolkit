[[scenario]]
id = "asset-store.batch-resume-reload"
title = "Повторное чтение состояния после ожидания"
revision = 1
kind = "short-cli"
status = "executable"
description = "SafeBatchRuntime: исходная загрузка пакетного состояния, затем batch_entries повторных снятий и захватов блокировки с перечитыванием state.json и проверкой ссылок на batch_blobs. Сценарий сравнивает полную повторную сверку с безопасным переиспользованием кэша уже проверенных неизменяемых blob; сетевое ожидание не входит в операцию."
measured = "Один запуск release-бинарника asset-store-bench: полная загрузка, затем заданное числом записей пакета число циклов release_lock, reacquire_lock и reload. Подготовка эталона, ожидание сети, прогрев и проверка постусловия в интервал не входят."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "asset-store", bin = "asset-store-bench" }
args = ["run", "batch-resume-reload", "--spec", "{input.workload}", "--workdir", "target/benchmark-workloads/asset-store"]
expect_exit_codes = [0]

[scenario.target.env]
inherit = ["PATH"]

[[scenario.parameter]]
name = "workload_spec"
description = "Файл синтетического пакета. Путь не публикуется: идентичность входа — SHA-256 спецификации и размер из пробы."
