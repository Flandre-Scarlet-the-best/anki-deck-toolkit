revision = 2
kind = "short-cli"
status = "executable"
description = "Открытие хранилища и публикация ingest новых идентичностей штатным ingest_verified: staging, семантическая проверка (полное декодирование изображения), атомарная фиксация файла, перезапись манифеста, интент и закрытие журнала, fsync. Один писатель."
measured = "Один запуск release-бинарника asset-store-bench от старта до выхода: открытие и все публикации, включая чтение входящих файлов. Восстановление рабочей копии (prepare) и проверка постусловий (conclude) в интервал не входят."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "asset-store", bin = "asset-store-bench" }
args = ["run", "ingest", "--spec", "{input.workload}", "--workdir", "target/benchmark-workloads/asset-store"]
expect_exit_codes = [0]

[scenario.target.env]
inherit = ["PATH"]

[[scenario.parameter]]
name = "workload_spec"
description = "Файл спецификации нагрузки, например benchmarks/workloads/asset-store/kanji-medium.toml. Путь не публикуется: нагрузку в результате представляют SHA-256 файла и объём из пробы."
required = true
record = false
affects_comparability = false

[[scenario.input]]
id = "workload"
kind = "external-path"
role = "workload"
identity = "file-sha256"
parameter = "workload_spec"
description = "Спецификация синтетического корпуса: домен, зерно, число записей, размеры изображений и пакетного состояния. Версия генератора входит в файл, поэтому SHA-256 файла описывает и содержимое корпуса."
size = [
    { name = "records", unit = "count", description = "Записей корпуса: идентичности и их форматные варианты.", measure = { kind = "probe", pointer = "/records" } },
    { name = "corpus_bytes", unit = "byte", description = "Суммарный размер байтов всех записей корпуса.", measure = { kind = "probe", pointer = "/corpus_bytes" } },
    { name = "ingest", unit = "count", description = "Новых идентичностей, публикуемых за прогон.", measure = { kind = "probe", pointer = "/ingest" } },
    { name = "ingest_bytes", unit = "byte", description = "Суммарный размер публикуемых за прогон байтов.", measure = { kind = "probe", pointer = "/ingest_bytes" } },
]

