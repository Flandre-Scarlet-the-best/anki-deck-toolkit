[[scenario]]
id = "asset-store.batch-checkpoint"
title = "Сохранение пакетного состояния"
revision = 2
kind = "short-cli"
status = "executable"
description = "SafeBatchRuntime: open, load с полной сверкой blob и save. unchanged сохраняет то же состояние; modified записывает новый неизменяемый blob, меняет запись и повышает ревизию. save атомарен и синхронизирует файл и каталог."
measured = "Один запуск release-бинарника asset-store-bench: открытие, загрузка и сохранение пакета рабочей копии. prepare и conclude в интервал не входят."
platforms = ["linux"]

[scenario.target]
program = { kind = "cargo-bin", package = "asset-store", bin = "asset-store-bench" }
args = ["run", "batch-checkpoint", "--spec", "{input.workload}", "--workdir", "target/benchmark-workloads/asset-store", "--change", "{param.change}"]
expect_exit_codes = [0]

[scenario.target.env]
inherit = ["PATH"]

[[scenario.parameter]]
name = "workload_spec"
description = "Файл спецификации нагрузки, например benchmarks/workloads/asset-store/kanji-medium.toml. Путь не публикуется: нагрузку в результате представляют SHA-256 файла и объём из пробы."
required = true
record = false
affects_comparability = false

[[scenario.parameter]]
name = "change"
description = "unchanged — повторное сохранение того же состояния; modified — новый blob, изменённая запись и ревизия + 1."
required = true
choices = ["unchanged", "modified"]
record = true
affects_comparability = true

[[scenario.input]]
id = "workload"
kind = "external-path"
role = "workload"
identity = "file-sha256"
parameter = "workload_spec"
description = "Спецификация синтетического корпуса: домен, зерно, число записей, размеры изображений и пакетного состояния. Версия генератора входит в файл, поэтому SHA-256 файла описывает и содержимое корпуса."
size = [
    { name = "batch_entries", unit = "count", description = "Записей пакетного состояния.", measure = { kind = "probe", pointer = "/batch_entries" } },
    { name = "batch_blobs", unit = "count", description = "Неизменяемых blob, на которые ссылается состояние.", measure = { kind = "probe", pointer = "/batch_blobs" } },
    { name = "batch_blob_bytes", unit = "byte", description = "Суммарный размер blob пакета.", measure = { kind = "probe", pointer = "/batch_blob_bytes" } },
]

[scenario.input.probe]
description = "asset-store-bench describe порождает корпус в памяти и сообщает его объём; на диск не пишет."
program = { kind = "cargo-bin", package = "asset-store", bin = "asset-store-bench" }
args = ["describe", "--spec", "{input.workload}"]
touches = "read-only"
timeout_seconds = 300

