# Политика зависимостей Cargo workspace для cargo-deny. Её исполняет задание
# «Зависимости Rust (cargo-deny)» в .github/workflows/ci.yml по фактическому
# Cargo.lock; локально — `cargo deny --locked check`.

[graph]
# Граф включает и необязательные возможности (`reference-generator` тянет resvg):
# политика относится ко всему, что workspace умеет собрать.
all-features = true

[advisories]
# Значения по умолчанию: уязвимости, unsound и unmaintained из RustSec — ошибки,
# yanked — предупреждение. Игнорирование advisory допустимо только точечно,
# с идентификатором RUSTSEC и причиной.
ignore = []

[licenses]
# Лицензии, фактически выбранные для графа зависимостей (с учётом выражений OR).
# Новая лицензия в графе — осознанное решение и правка этого списка, а не
# автоматическое согласие.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

# Исключения только для собственных пакетов workspace под AGPL-3.0-only.
# Глобальный allow для сторонних зависимостей остаётся неизменным:
# новая AGPL-зависимость требует отдельного решения о совместимости.

[[licenses.exceptions]]
name = "anki-e2e"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "anki-repo"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "asset-store"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "benchmark-contract"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "benchmark-history"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "benchmark-runner"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "repository-maintenance"
allow = ["AGPL-3.0-only"]

[bans]
# Несколько версий одного crate в графе — обычное следствие экосистемы, а не дефект.
multiple-versions = "allow"
# Версии из реестра без ограничения (`*`) запрещены; path-зависимости между
# неопубликуемыми участниками workspace — не wildcard в этом смысле.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Только crates.io: сторонние реестры и git-источники требуют явного решения.
unknown-registry = "deny"
unknown-git = "deny"
