[package]
name = "anki-e2e"
version = "0.1.0"
# `edition` и MSRV наследуются из корневого `[workspace.package]`.
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Изолированный локальный E2E-стенд настоящей Linux Anki Desktop для anki-repo anki"
publish = false

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
getrandom = { version = "0.4", features = ["std"] }
png = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
x11rb = { version = "0.14", features = ["xtest"] }
zbus = { version = "6.1", default-features = false, features = ["default-rt"] }
# Браузерный набор Forvo-Brave: настоящий bridge и контракты asset-store,
# HTTPS fixture-сервер и CDP-драйвер изолированного тестового Chromium. Образ
# Anki собирает стенд без этой feature.
asset-store = { path = "../asset-store", optional = true }
chromiumoxide = { version = "0.9.1", optional = true }
futures = { version = "0.3", optional = true }
rustls-pki-types = { version = "1.15", optional = true, features = ["std"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "process", "fs"] }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = ["aws_lc_rs", "tls12"] }

[features]
default = ["browser"]
browser = ["dep:asset-store", "dep:chromiumoxide", "dep:futures", "dep:rustls-pki-types", "dep:tokio", "dep:tokio-rustls"]

[[bin]]
name = "anki-e2e"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
